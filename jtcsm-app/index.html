<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今天吃什么</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff8a50">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="今天吃什么">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }

  .card {
    width: 100%;
    max-width: 480px;
    background: rgba(255, 255, 255, 0.92);
    border-radius: 20px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
    padding: 28px 24px;
    backdrop-filter: blur(6px);
  }

  h1 {
    text-align: center;
    font-size: 26px;
    color: #e05a2b;
    margin-bottom: 18px;
    letter-spacing: 2px;
  }

  /* ============ 锁定页（密码锁，别人看不到你的内容） ============ */
  .lock-tip {
    text-align: center;
    color: #c07a4a;
    font-size: 15px;
    margin-bottom: 16px;
  }

  .lock-row { margin-bottom: 12px; }

  .lock-row input {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 15px;
    outline: none;
  }
  .lock-row input:focus { border-color: #ff8a50; }

  .lock-msg {
    text-align: center;
    font-size: 13px;
    color: #d9534f;
    min-height: 18px;
    margin-top: 8px;
  }

  .lock-hint {
    text-align: center;
    font-size: 12px;
    color: #bbb;
    line-height: 1.7;
    margin-top: 12px;
  }

  /* ============ 选择页（谁在用这台设备） ============ */
  .pick-list { list-style: none; margin-bottom: 14px; }
  .pick-item {
    padding: 11px 14px;
    margin-bottom: 6px;
    background: #fff9f4;
    border: 1px solid #ffe3d0;
    border-radius: 10px;
    font-size: 15px;
    color: #555;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: background 0.15s;
  }
  .pick-item:hover { background: #fff1e6; }
  .pick-item .current-badge {
    font-size: 11px;
    color: #e05a2b;
    border: 1px solid #ffc4a0;
    border-radius: 6px;
    padding: 1px 6px;
  }
  .pick-back-row { text-align: center; margin: 10px 0 2px; }
  .pick-list-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 4px 8px;
    font-size: 14px;
    color: #888;
    cursor: pointer;
    user-select: none;
    border-bottom: 1px dashed #f0d9c6;
    margin-bottom: 8px;
  }
  .pick-list-head:hover { color: #c07a4a; }
  .pick-toggle { font-size: 12px; color: #c07a4a; }
  .pick-right { display: flex; align-items: center; gap: 10px; }
  .forgot-btn {
    display: block;
    margin: 4px auto 0;
    padding: 4px 10px;
    border: none;
    background: none;
    color: #c07a4a;
    font-size: 12px;
    cursor: pointer;
    text-decoration: underline;
  }
  .forgot-btn:hover { color: #e05a2b; }

  /* ============ 退出按钮 ============ */
  .logout-btn {
    margin-left: 8px;
    padding: 5px 12px;
    border: 1px solid #e5c0a8;
    background: #fff;
    color: #c07a4a;
    border-radius: 8px;
    font-size: 12px;
    cursor: pointer;
  }
  .logout-btn:hover { background: #fff4ec; }

  /* ============ 滚动视窗（开箱区） ============ */
  .result-box {
    position: relative;
    height: 120px;
    overflow: hidden;
    border: 2px dashed #f5b58f;
    border-radius: 14px;
    background: #fff7f2;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .result-box.rolling {
    border-color: #e05a2b;
    border-style: solid;
    box-shadow: inset 0 0 30px rgba(224, 90, 43, 0.12);
  }

  .result-box .hint {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #c9a98c;
    font-size: 15px;
    z-index: 2;
    background: #fff7f2;
  }

  .reel {
    display: flex;
    align-items: center;
    gap: 10px;
    will-change: transform;
  }

  .reel-item {
    flex: 0 0 100px;
    width: 100px;
    height: 80px;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
    color: #fff;
    user-select: none;
    position: relative;
    box-shadow: 0 3px 8px rgba(0, 0, 0, 0.18);
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }

  .reel-item .emoji { font-size: 28px; line-height: 1; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.25)); }
  .reel-item .name {
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 88px;
    text-shadow: 0 1px 2px rgba(0,0,0,0.3);
  }

  /* 指针指到的卡片：放大 + 金色光框；滚走后自动恢复原样 */
  .reel-item.active {
    transform: scale(1.25);
    box-shadow: 0 0 0 3px #ffb800, 0 8px 26px rgba(255, 184, 0, 0.5);
    z-index: 5;
  }

  /* 中央指针（选中标记） */
  .reel-marker { position: absolute; top: 0; bottom: 0; left: 50%; width: 0; pointer-events: none; z-index: 6; }
  .reel-marker .tip-top {
    position: absolute; top: -2px; left: 50%; transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 9px solid transparent; border-right: 9px solid transparent;
    border-top: 12px solid #e05a2b;
    filter: drop-shadow(0 2px 3px rgba(224,90,43,0.4));
  }
  .reel-marker .tip-bottom {
    position: absolute; bottom: -2px; left: 50%; transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 9px solid transparent; border-right: 9px solid transparent;
    border-bottom: 12px solid #e05a2b;
    filter: drop-shadow(0 -2px 3px rgba(224,90,43,0.4));
  }

  /* 抽中结果文字 */
  .pick-result {
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    color: #e05a2b;
    min-height: 28px;
    margin-bottom: 12px;
    padding: 0 8px;
  }

  /* ============ 按钮 ============ */
  .draw-btn {
    width: 100%;
    padding: 14px;
    font-size: 20px;
    font-weight: bold;
    color: #fff;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #ff9a56, #ff6a3d);
    cursor: pointer;
    letter-spacing: 4px;
    box-shadow: 0 6px 18px rgba(255, 106, 61, 0.4);
    transition: transform 0.1s, box-shadow 0.1s, opacity 0.2s;
    margin-bottom: 20px;
  }

  .draw-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(255, 106, 61, 0.5); }
  .draw-btn:active:not(:disabled) { transform: translateY(0); }
  .draw-btn:disabled { opacity: 0.6; cursor: wait; }

  .controls {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
  }

  .controls label { font-size: 14px; color: #666; white-space: nowrap; }

  .controls input[type="number"] {
    width: 60px;
    padding: 6px 8px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
    text-align: center;
  }

  .clear-btn {
    margin-left: auto;
    padding: 7px 14px;
    border: 1px solid #e5c0a8;
    background: #fff;
    color: #c07a4a;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
  }
  .clear-btn:hover { background: #fff4ec; }

  /* ============ 添加食物 ============ */
  .add-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }

  .add-row input[type="text"] {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 15px;
    outline: none;
  }
  .add-row input[type="text"]:focus { border-color: #ff8a50; }

  .add-btn {
    padding: 10px 18px;
    border: none;
    border-radius: 10px;
    background: #ff8a50;
    color: #fff;
    font-size: 15px;
    cursor: pointer;
    white-space: nowrap;
  }
  .add-btn:hover { background: #ff7438; }

  /* ============ 食物列表 ============ */
  .list-title {
    font-size: 14px;
    color: #888;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
  }

  .food-list { list-style: none; max-height: 260px; overflow-y: auto; }

  .food-list li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px;
    margin-bottom: 6px;
    background: #fff9f4;
    border-radius: 10px;
    font-size: 15px;
    color: #555;
  }

  .food-list li:hover { background: #fff1e6; }

  .food-name { flex: 1; }

  .del-btn {
    border: none;
    background: none;
    color: #d9534f;
    font-size: 16px;
    cursor: pointer;
    padding: 0 4px;
    opacity: 0.6;
  }
  .del-btn:hover { opacity: 1; }

  .empty-tip {
    text-align: center;
    color: #bbb;
    padding: 16px 0;
    font-size: 14px;
  }

  footer {
    text-align: center;
    font-size: 12px;
    color: #c0a08a;
    margin-top: 12px;
  }
</style>

<body>
  <div class="card">
    <h1>🍜 今天吃什么</h1>

    <!-- 选择页：平时打开直接进入上次的人，想换人才来这里 -->
    <div id="pickScreen" hidden>
      <p class="lock-tip">👋 选一个人，或创建一个新的</p>
      <div class="pick-list-head" id="pickListHead" role="button" tabindex="0">
        <span>👥 用户列表（<span id="pickCount">0</span>）</span>
        <span class="pick-toggle" id="pickToggle">▲ 收起</span>
      </div>
      <ul class="pick-list" id="pickList"></ul>

      <div class="add-row" id="pickNameRow">
        <input type="text" id="pickName" placeholder="新名字，创建一个人">
      </div>
      <div class="lock-row">
        <input type="password" id="pickPwd" placeholder="设置密码（可留空）" autocomplete="off">
      </div>
      <button class="draw-btn" id="pickConfirm" style="letter-spacing:2px;">✨ 创建并进入</button>
      <p class="lock-msg" id="pickMsg"></p>
      <button class="forgot-btn" id="forgotBtn">忘记密码？</button>
      <div class="pick-back-row">
        <button class="logout-btn" id="pickBack" hidden>← 返回</button>
      </div>
      <p class="lock-hint"></p>
    </div>

    <!-- 应用内容：登录后才显示 -->
    <div id="appArea" hidden>
      <div class="result-box" id="resultBox">
        <span class="hint" id="resultHint">点击下方按钮，开始滚动抽取</span>
        <div class="reel" id="reel"></div>
        <div class="reel-marker">
          <span class="tip-top"></span>
          <span class="tip-bottom"></span>
        </div>
      </div>
      <div class="pick-result" id="pickResult"></div>

      <button class="draw-btn" id="drawBtn">🎲 随机抽取</button>

      <div class="controls">
        <label for="countInput">抽取数量：</label>
        <input type="number" id="countInput" min="1" max="20" value="1">
        <button class="clear-btn" id="clearBtn">清空列表</button>
      </div>

      <div class="add-row">
        <input type="text" id="foodInput" placeholder="输入想吃的美食，回车添加">
        <button class="add-btn" id="addBtn">＋ 添加</button>
      </div>

      <p class="list-title">食物列表（<span id="foodCount">0</span>）</p>
      <ul class="food-list" id="foodList"></ul>

      <footer>
        当前：<span id="loginName"></span>
        <button class="logout-btn" id="switchBtn">切换用户</button>
      </footer>
    </div>
  </div>

<script>
// ============ 默认食物列表（用户可自行增删修改） ============
const DEFAULT_FOODS = [
  "火锅", "麻辣烫", "兰州拉面", "黄焖鸡米饭",
  "沙县小吃", "汉堡薯条", "蛋炒饭", "饺子",
  "盖浇饭", "烧烤", "螺蛳粉", "烤冷面"
];

// ============ 账号与密码锁（每个人只能看到自己的内容） ============
const ACCOUNTS_KEY = "what-to-eat-accounts";   // { 名字: 密码指纹（"" 表示没设密码） }
const LAST_USER_KEY = "what-to-eat-lastuser";  // 上次使用的人，用于自动进入
const ADMIN_KEY = "what-to-eat-admin";         // 管理员密码指纹（"" 表示还没设置）
const LEGACY_KEY = "what-to-eat-foods";        // 更早版本的数据键

let currentName = "";   // 只有登录成功后才会被赋值
let foods = [...DEFAULT_FOODS];

// 密码指纹（不存明文密码；用于同一台设备上家人之间互不查看）
function hashPassword(pwd) {
  const s = "jtcsm::" + pwd;
  let h1 = 0x811c9dc5, h2 = 0x9e3779b9;
  for (let i = 0; i < s.length; i++) {
    const c = s.charCodeAt(i);
    h1 = Math.imul(h1 ^ c, 16777619);
    h2 = Math.imul(h2 ^ (c + i), 2246822519);
  }
  return (h1 >>> 0).toString(16) + (h2 >>> 0).toString(16);
}

function getAccounts() {
  try {
    const acc = JSON.parse(localStorage.getItem(ACCOUNTS_KEY));
    if (acc && typeof acc === "object") return acc;
  } catch (e) { /* 忽略损坏数据 */ }
  return {};
}

function saveAccounts(acc) {
  localStorage.setItem(ACCOUNTS_KEY, JSON.stringify(acc));
}

function getLastUser() {
  try { return localStorage.getItem(LAST_USER_KEY) || ""; } catch (e) { return ""; }
}

function setLastUser(name) {
  try { localStorage.setItem(LAST_USER_KEY, name); } catch (e) { /* 忽略 */ }
}

function getAdminPwd() {
  try { return localStorage.getItem(ADMIN_KEY) || ""; } catch (e) { return ""; }
}

function setAdminPwd(fp) {
  try { localStorage.setItem(ADMIN_KEY, fp); } catch (e) { /* 忽略 */ }
}

// 每个名字对应一套食物列表，都存在本浏览器里
function storageKeyFor(name) {
  return "what-to-eat-foods:" + name;
}

function loadFoods(name) {
  try {
    const saved = JSON.parse(localStorage.getItem(storageKeyFor(name)));
    if (Array.isArray(saved) && saved.length > 0) return saved;
  } catch (e) { /* 忽略损坏数据 */ }
  return [...DEFAULT_FOODS];
}

function saveFoods() {
  if (!currentName) return;
  localStorage.setItem(storageKeyFor(currentName), JSON.stringify(foods));
}

// 升级旧版数据：原来的列表和人名归到账号下，默认密码 123456
function migrateLegacy() {
  if (Object.keys(getAccounts()).length > 0) return; // 已经有账号了
  const accounts = {};
  try {
    const oldProfiles = JSON.parse(localStorage.getItem("what-to-eat-profiles"));
    if (Array.isArray(oldProfiles) && oldProfiles.length > 0) {
      oldProfiles.forEach(name => { accounts[name] = hashPassword("123456"); });
    } else {
      const legacy = JSON.parse(localStorage.getItem(LEGACY_KEY));
      if (Array.isArray(legacy) && legacy.length > 0) {
        localStorage.setItem(storageKeyFor("我"), JSON.stringify(legacy));
        accounts["我"] = hashPassword("123456");
      }
    }
  } catch (e) { /* 忽略损坏数据 */ }
  if (Object.keys(accounts).length > 0) saveAccounts(accounts);
}

// ============ DOM 引用 ============
const resultBox = document.getElementById("resultBox");
const resultHint = document.getElementById("resultHint");
const reelEl = document.getElementById("reel");
const pickResult = document.getElementById("pickResult");
const drawBtn = document.getElementById("drawBtn");
const countInput = document.getElementById("countInput");
const clearBtn = document.getElementById("clearBtn");
const foodInput = document.getElementById("foodInput");
const addBtn = document.getElementById("addBtn");
const foodList = document.getElementById("foodList");
const foodCount = document.getElementById("foodCount");
const pickScreen = document.getElementById("pickScreen");
const appArea = document.getElementById("appArea");
const pickList = document.getElementById("pickList");
const pickListHead = document.getElementById("pickListHead");
const pickCount = document.getElementById("pickCount");
const pickToggle = document.getElementById("pickToggle");
const pickName = document.getElementById("pickName");
const pickNameRow = document.getElementById("pickNameRow");
const pickPwd = document.getElementById("pickPwd");
const pickConfirm = document.getElementById("pickConfirm");
const pickMsg = document.getElementById("pickMsg");
const pickBack = document.getElementById("pickBack");
const forgotBtn = document.getElementById("forgotBtn");
const loginName = document.getElementById("loginName");
const switchBtn = document.getElementById("switchBtn");

// ============ 开箱常量 ============
const ITEM_W = 100;          // 卡片宽度（px）
const ITEM_STEP = 110;       // 卡片宽度 + 间距 = 滚动步长

const EMOJIS = ["🍜","🍕","🍔","🌮","🍣","🍤","🍗","🍖","🥟","🍚","🍲","🥡","🍢","🥗","🍝","🥘","🌽","🥐"];
const COLORS = [
  "#ff7a59","#ffa44d","#f7b733","#ff6f61","#e056a0","#9b6bff",
  "#5b8cff","#2fb3a5","#4fae4f","#c98a3d","#d95f76","#6a8ddb"
];

// ============ 工具函数 ============
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function hashIndex(i) {
  let h = 0;
  const s = String(i);
  for (let k = 0; k < s.length; k++) h = (h * 31 + s.charCodeAt(k)) >>> 0;
  return h;
}

// ============ 构造滚轮数据 ============
// 将食物打乱后重复多份，再整体乱序，避免出现肉眼可见的周期
function buildReel() {
  const base = shuffle([...foods]);
  const repeats = Math.max(4, Math.ceil(44 / base.length));
  let arr = [];
  for (let i = 0; i < repeats; i++) arr = arr.concat(base);
  return shuffle(arr);
}

function renderReel(reel) {
  reelEl.innerHTML = "";
  reel.forEach((name, i) => {
    const h = hashIndex(i + 1);
    const item = document.createElement("div");
    item.className = "reel-item";
    item.style.background = COLORS[h % COLORS.length];
    item.innerHTML =
      `<span class="emoji">${EMOJIS[h % EMOJIS.length]}</span>` +
      `<span class="name">${escapeHtml(name)}</span>`;
    reelEl.appendChild(item);
  });
  reelEl.style.transform = "translateX(0)";   // 每次开新轮都从起点开始
}

// ============================================================
//  ★★★ 滚动减速手感调节区 —— 改完刷新页面即可生效 ★★★
// ============================================================
const ROLL_DURATION   = 3000;  // 单次滚动总时长（毫秒）。越大滚得越久，末尾慢速段也跟着变长
                               //   例如：2600 = 滚 2.6 秒；想更干脆就调小，想更悠长就调大
const ROLL_FAST_PHASE = 0.55;  // 前多少比例的时间用于"快速滚动"（0.55 = 前55%时间在快速滚）
                               //   剩下的 45% 时间全部用来慢速滑行
                               //   越接近 1：慢速段越短、停得越干脆；越接近 0：慢速段越长
const ROLL_FAST_DIST  = 0.85;  // 快速段要跑完总路程的多少比例（0.82 = 82%）
                               //   剩下的 18% 路程留给慢速段慢慢爬完
                               //   越接近 1：慢速段越短；越小：慢速段越长（更有"期待感"）

// 滚动位置随时间的变化曲线（返回 0→1），一般不用改
function rollEase(t) {
  if (t < ROLL_FAST_PHASE) {
    // —— 快速段：匀速飞快掠过，营造"快速开箱"的感觉 ——
    return ROLL_FAST_DIST * (t / ROLL_FAST_PHASE);
  }
  // —— 慢速段：三次方缓出，速度一路递减，最终停在指针下 ——
  const p = (t - ROLL_FAST_PHASE) / (1 - ROLL_FAST_PHASE);
  return ROLL_FAST_DIST + (1 - ROLL_FAST_DIST) * (1 - Math.pow(1 - p, 3));
}

// ============ 滚动动画：快速滚动 → 明显降速 → 蠕行到停 ============
function animateReel(reel, targetIndex, duration) {
  return new Promise(resolve => {
    const centerOffset = (resultBox.clientWidth - ITEM_W) / 2;
    const finalX = centerOffset - targetIndex * ITEM_STEP; // 目标卡片正好停在中央
    const startTime = performance.now();
    const items = reelEl.children;
    let lastActive = -1;

    // 指针指到的卡片放大，滚走后恢复原样
    function setActive(i) {
      if (i === lastActive) return;
      if (lastActive >= 0 && items[lastActive]) items[lastActive].classList.remove("active");
      if (i >= 0 && i < items.length && items[i]) items[i].classList.add("active");
      lastActive = i;
    }

    function frame(now) {
      const t = Math.min(1, (now - startTime) / duration);
      const eased = rollEase(t);   // 位置曲线由上面"减速手感调节区"的参数控制
      const x = finalX * eased;
      reelEl.style.transform = `translateX(${x}px)`;

      // 当前停在指针下的卡片序号
      const active = Math.round((centerOffset - x) / ITEM_STEP);
      setActive(active);

      if (t < 1) {
        requestAnimationFrame(frame);
      } else {
        reelEl.style.transform = `translateX(${finalX}px)`;
        resolve();
      }
    }
    requestAnimationFrame(frame);
  });
}

// ============ 开箱主流程 ============
let rolling = false;

drawBtn.addEventListener("click", startDraw);

async function startDraw() {
  if (rolling) return;

  if (foods.length === 0) {
    pickResult.textContent = "列表为空，请先添加美食";
    return;
  }

  const count = Math.min(Math.max(parseInt(countInput.value) || 1, 1), foods.length);
  rolling = true;
  drawBtn.disabled = true;
  resultHint.style.display = "none";
  resultBox.classList.add("rolling");
  pickResult.textContent = "";

  // 抽的数量越多，单次滚动稍快一些，避免等待太久；总时长取上面调节区的 ROLL_DURATION
  const baseDuration = Math.max(1100, ROLL_DURATION - (count - 1) * 150);
  const winners = [];

  for (let k = 0; k < count; k++) {
    const reel = buildReel();
    renderReel(reel);

    // 目标落在滚轮中后段，留足滚动距离，且保证每道菜被抽中的概率接近
    const minIdx = Math.floor(reel.length * 0.35);
    const maxIdx = Math.floor(reel.length * 0.75);
    const target = minIdx + Math.floor(Math.random() * (maxIdx - minIdx + 1));
    const winner = reel[target];

    await animateReel(reel, target, baseDuration);
    // 停稳后指针下的卡片已自动保持放大状态

    winners.push(winner);
    pickResult.textContent = count > 1
      ? `第 ${k + 1} 个：${winner}`
      : `🎉 ${winner}！🎉`;

    if (k < count - 1) await sleep(650); // 稍作停顿再开下一次
  }

  if (count > 1) {
    pickResult.textContent = `🎉 今日推荐：${winners.join("、")}`;
  }

  resultBox.classList.remove("rolling");
  rolling = false;
  drawBtn.disabled = false;
}

// ============ 进入 / 切换用户 ============
let pendingName = "";     // 在“选择页”里点了一个带密码的人时，用它暂存
let pendingAction = "enter";  // 密码验证通过后做什么："enter" 进入 / "delete" 删除 / "admin-set" 设管理员 / "admin-verify" 验证管理员 / "reset-new" 重置某人密码
let listCollapsed = false;    // 用户列表是否收起
let adminMode = false;        // 管理员身份是否已确认（可重置任意人的密码）

function resetPickForm() {
  pendingName = "";
  pendingAction = "enter";
  pickName.value = "";
  pickNameRow.hidden = false;
  pickPwd.value = "";
  pickPwd.placeholder = "设置密码（可留空）";
  pickConfirm.textContent = "✨ 创建并进入";
  pickMsg.textContent = "";
}

// 忘记密码按钮的文字，随状态变化
function updateForgotBtn() {
  if (adminMode) {
    forgotBtn.textContent = "🔑 管理员已确认（点此退出）";
  } else if (getAdminPwd()) {
    forgotBtn.textContent = "忘记密码？";
  } else {
    forgotBtn.textContent = "忘记密码？（首次需先设置管理员）";
  }
}

function showApp() {
  pickScreen.hidden = true;
  appArea.hidden = false;
  loginName.textContent = currentName;
  renderList();
}

// 进入某个人：切换“当前人”，并记住，下次打开直接进
function enterUser(name) {
  currentName = name;
  foods = loadFoods(name);
  setLastUser(name);
  showApp();
}

function showPick(msg, opts) {
  appArea.hidden = true;
  pickScreen.hidden = false;
  adminMode = false;              // 每次进入选择页都退出管理员模式
  resetPickForm();
  pickMsg.textContent = msg || "";
  pickBack.hidden = !(opts && opts.canBack);   // 切换时显示“返回”，首次打开不显示
  renderPickList();
  updateForgotBtn();
  pickName.focus();
}

function renderPickList() {
  pickList.innerHTML = "";
  const names = Object.keys(getAccounts()).sort();
  pickCount.textContent = names.length;

  if (names.length === 0) {
    pickListHead.style.display = "none";
    pickList.style.display = "";
    pickList.innerHTML = '<li class="empty-tip">还没有任何人，先在下方创建一个吧</li>';
    return;
  }
  pickListHead.style.display = "";
  pickList.style.display = listCollapsed ? "none" : "";
  pickToggle.textContent = listCollapsed ? "▼ 展开" : "▲ 收起";

  names.forEach(name => {
    const li = document.createElement("li");
    li.className = "pick-item";

    const span = document.createElement("span");
    span.textContent = name;
    li.appendChild(span);

    // 右侧：当前标记 + 删除按钮
    const right = document.createElement("span");
    right.className = "pick-right";
    if (name === currentName) {
      const badge = document.createElement("span");
      badge.className = "current-badge";
      badge.textContent = "当前";
      right.appendChild(badge);
    }
    const del = document.createElement("button");
    del.className = "del-btn";
    del.textContent = "🗑";
    del.title = "删除这个人（连同 TA 的列表）";
    del.addEventListener("click", (e) => {
      e.stopPropagation();   // 点删除不要触发“进入”
      deleteUserRequest(name);
    });
    right.appendChild(del);
    li.appendChild(right);

    li.addEventListener("click", () => selectUser(name));
    pickList.appendChild(li);
  });
}

// 点了列表里的一个人：
//   - 没设密码（或就是自己）→ 直接进入
//   - 设了密码 → 在这里输密码验证
function selectUser(name) {
  if (name === currentName) { showApp(); return; }
  const accounts = getAccounts();
  if (!accounts[name]) {
    enterUser(name);
    return;
  }
  if (adminMode) {
    // 管理员模式：不用原密码，直接给这个人设新密码
    pendingName = name;
    pendingAction = "reset-new";
    pickNameRow.hidden = true;
    pickPwd.value = "";
    pickPwd.placeholder = "为「" + name + "」设置新密码（可留空=不需要密码）";
    pickConfirm.textContent = "💾 保存新密码";
    pickMsg.textContent = "管理员已确认，无需原密码";
    pickPwd.focus();
    return;
  }
  pendingName = name;
  pendingAction = "enter";
  pickPwd.value = "";
  pickPwd.placeholder = "输入「" + name + "」的密码";
  pickConfirm.textContent = "🔓 进入 " + name;
  pickMsg.textContent = "";
  pickPwd.focus();
}

// 选择页的确认按钮：创建新的人，或验证密码进入已点选的人
function pickAction() {
  const accounts = getAccounts();

  // —— 忘记密码 / 管理员相关（不需要目标用户的密码） ——
  if (pendingAction === "admin-set") {
    const pwd = pickPwd.value;
    if (!pwd) { pickMsg.textContent = "请设置一个管理员密码"; return; }
    setAdminPwd(hashPassword(pwd));
    adminMode = true;
    resetPickForm();
    renderPickList();
    updateForgotBtn();
    pickMsg.textContent = "管理员密码已设置，点任一人即可重置 TA 的密码";
    return;
  }
  if (pendingAction === "admin-verify") {
    const pwd = pickPwd.value;
    if (!pwd) { pickMsg.textContent = "请输入管理员密码"; return; }
    if (getAdminPwd() !== hashPassword(pwd)) {
      pickMsg.textContent = "管理员密码不对";
      return;
    }
    adminMode = true;
    resetPickForm();
    renderPickList();
    updateForgotBtn();
    pickMsg.textContent = "管理员身份已确认，点任一人即可重置 TA 的密码";
    return;
  }
  if (pendingAction === "reset-new" && pendingName) {
    const target = pendingName;
    const pwd = pickPwd.value;
    accounts[target] = pwd ? hashPassword(pwd) : "";
    saveAccounts(accounts);
    resetPickForm();
    renderPickList();
    updateForgotBtn();
    pickMsg.textContent = "已重置「" + target + "」的密码" + (pwd ? "" : "（改为不需要密码）");
    return;
  }

  // —— 普通：输入某人的密码 ——
  if (pendingName) {
    const pwd = pickPwd.value;
    if (!pwd) { pickMsg.textContent = "请输入「" + pendingName + "」的密码"; return; }
    if (accounts[pendingName] !== hashPassword(pwd)) {
      pickMsg.textContent = "密码不对，进不去哦";
      return;
    }
    if (pendingAction === "delete") {
      doDeleteUser(pendingName);
    } else {
      enterUser(pendingName);
    }
    return;
  }

  // —— 创建新人 ——
  const name = pickName.value.trim();
  if (!name) { pickMsg.textContent = "请填一个名字"; pickName.focus(); return; }
  if (accounts[name]) {
    pickMsg.textContent = "这个名字已经存在，直接在列表里点它";
    return;
  }
  const pwd = pickPwd.value;
  accounts[name] = pwd ? hashPassword(pwd) : "";   // 密码可留空；留空则切换时不用输
  saveAccounts(accounts);
  enterUser(name);
}

// 点列表里的“🗑”：没设密码的直接确认删除；设了密码的先验证密码
function deleteUserRequest(name) {
  const accounts = getAccounts();
  if (!accounts[name] || adminMode) {   // 没设密码，或管理员模式下：直接删除
    doDeleteUser(name);
    return;
  }
  pendingName = name;
  pendingAction = "delete";
  pickPwd.value = "";
  pickPwd.placeholder = "输入「" + name + "」的密码";
  pickConfirm.textContent = "🗑 删除 " + name;
  pickMsg.textContent = "";
  pickPwd.focus();
}

// 真正执行删除（已验证密码，或该人没设密码）
function doDeleteUser(name) {
  if (!confirm("确定删除「" + name + "」吗？\nTA 的食物列表也会一起删除，无法恢复。")) {
    resetPickForm();
    renderPickList();
    return;
  }
  const accounts = getAccounts();
  delete accounts[name];
  saveAccounts(accounts);
  try { localStorage.removeItem(storageKeyFor(name)); } catch (e) { /* 忽略 */ }

  if (currentName === name) {
    currentName = "";          // 删掉的是当前正在用的人
    showPick("", { canBack: false });
  } else {
    resetPickForm();
    renderPickList();
  }
}

pickConfirm.addEventListener("click", pickAction);
pickName.addEventListener("keydown", (e) => { if (e.key === "Enter") pickAction(); });
pickPwd.addEventListener("keydown", (e) => { if (e.key === "Enter") pickAction(); });

// 在“新建名字”框里打字时，取消之前点选的人，回到新建状态
pickName.addEventListener("input", () => {
  if (pendingName && pickName.value.trim()) resetPickForm();
});

// 点击“用户列表”标题栏：收起 / 展开
pickListHead.addEventListener("click", () => {
  listCollapsed = !listCollapsed;
  renderPickList();
});
pickListHead.addEventListener("keydown", (e) => {
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pickListHead.click(); }
});

pickBack.addEventListener("click", () => {
  if (currentName) showApp();
});

// 忘记密码：没设过管理员就先设置；设过则验证；管理员模式下点此退出
forgotBtn.addEventListener("click", () => {
  pendingName = "";
  pickName.value = "";
  if (adminMode) {
    adminMode = false;
    resetPickForm();
    renderPickList();
    updateForgotBtn();
    pickMsg.textContent = "已退出管理员模式";
    return;
  }
  if (!getAdminPwd()) {
    pendingAction = "admin-set";
    pickNameRow.hidden = true;
    pickPwd.value = "";
    pickPwd.placeholder = "设置管理员密码（仅首次）";
    pickConfirm.textContent = "🔑 保存管理员密码";
    pickMsg.textContent = "第一次使用忘记密码：先设置一个管理员密码，以后用它重置任何人的密码";
    pickPwd.focus();
    return;
  }
  pendingAction = "admin-verify";
  pickNameRow.hidden = true;
  pickPwd.value = "";
  pickPwd.placeholder = "输入管理员密码";
  pickConfirm.textContent = "🔑 验证";
  pickMsg.textContent = "验证管理员密码后，可重置任何人的密码（不用输原密码）";
  pickPwd.focus();
});

switchBtn.addEventListener("click", () => showPick("", { canBack: true }));

// ============ 列表管理 ============
function renderList() {
  foodList.innerHTML = "";
  foodCount.textContent = foods.length;

  if (foods.length === 0) {
    foodList.innerHTML = '<li class="empty-tip">列表为空，请在下方添加美食</li>';
    return;
  }

  foods.forEach((name, index) => {
    const li = document.createElement("li");
    const span = document.createElement("span");
    span.className = "food-name";
    span.textContent = name;
    const del = document.createElement("button");
    del.className = "del-btn";
    del.textContent = "✕";
    del.title = "删除";
    del.addEventListener("click", () => removeFood(index));
    li.appendChild(span);
    li.appendChild(del);
    foodList.appendChild(li);
  });
}

function removeFood(index) {
  foods.splice(index, 1);
  saveFoods();
  renderList();
}

function addFood() {
  const name = foodInput.value.trim();
  if (!name) { foodInput.focus(); return; }

  if (foods.includes(name)) {
    foodInput.value = "";
    foodInput.placeholder = "这道菜已经在列表里了";
    setTimeout(() => { foodInput.placeholder = "输入想吃的美食，回车添加"; }, 1500);
    return;
  }

  foods.push(name);
  saveFoods();
  renderList();
  foodInput.value = "";
  foodInput.focus();
}

addBtn.addEventListener("click", addFood);
foodInput.addEventListener("keydown", (e) => { if (e.key === "Enter") addFood(); });

clearBtn.addEventListener("click", () => {
  if (foods.length === 0) return;
  if (confirm("确定清空所有食物吗？（已添加的内容将丢失）")) {
    foods = [];
    saveFoods();
    renderList();
  }
});

// ============ 初始化 ============
migrateLegacy();       // 把旧版本的数据搬进账号体系
const savedUser = getLastUser();
if (savedUser && getAccounts()[savedUser] !== undefined) {
  // 上次的人还在：直接进入，不用输密码
  currentName = savedUser;
  foods = loadFoods(savedUser);
  showApp();
} else {
  // 第一次打开（或上次的人已不存在）：先选择 / 创建一个人
  currentName = "";
  foods = [...DEFAULT_FOODS];
  showPick("", { canBack: false });
}
</script>
